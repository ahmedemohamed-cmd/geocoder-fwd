server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config written by the provisioner (never cached).
    location = /runtime/config.json {
        add_header Cache-Control "no-store";
        try_files /runtime/config.json =404;
    }

    # Hashed build assets are immutable → cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, so new deploys (new asset hashes) are
    # picked up immediately without a manual hard refresh.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA client-side routing: serve index.html for unknown paths (e.g. /callback).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

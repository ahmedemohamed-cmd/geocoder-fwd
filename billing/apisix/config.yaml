# Apache APISIX — the metered data plane (etcd-backed, admin API enabled).
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: billing-apisix-admin-key-change-me
        role: admin
    admin_listen:
      ip: 0.0.0.0
      port: 9180
  etcd:
    host:
      - "http://etcd:2379"
    prefix: /apisix
    timeout: 30

apisix:
  node_listen: 9080
  enable_control: true
  # APISIX encrypts sensitive plugin fields (e.g. key-auth keys) at rest in etcd.
  data_encryption:
    enable_encrypt_fields: true
    keyring:
      - edd1c9f034335f13   # exactly 16 chars (AES-128)

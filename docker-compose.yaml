services:
  nats:
    image: nats:2.10
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command: "-c /etc/nats/nats.conf"
    volumes:
      - nats-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    # Redis here is a pure derived cache — NO persistence needed:
    #   • autocomplete index (rebuilt from ES every 10 min; ~600k prefix keys),
    #   • watcher node-coord cache during ingest,
    #   • /geocode result cache (cache:v1:* keys, 300s TTL).
    # The default RDB background-save fork during the autocomplete warm-up write
    # storm caused a copy-on-write spike that OOM-killed the container (exit 137),
    # so RDB+AOF are disabled and maxmemory+LRU let Redis evict gracefully.
    # maxmemory was 850mb, but the autocomplete index alone exceeded it and
    # thrashed (100M+ evictions → autocomplete silently falling back to ES). With
    # the result cache added on top it needs real room: 3gb (safely under the 5G
    # container limit given Redis fragmentation ~1.3x). allkeys-lru keeps the hot
    # autocomplete keys (touched every request) and sheds cold/TTL'd cache entries.
    command: >
      redis-server --save "" --appendonly no
      --maxmemory 3gb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 5G

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          # Cap ES CPU so bulk indexing / query bursts can't monopolise the host.
          # Heap is fixed at 4g (ES_JAVA_OPTS); tune `cpus` to leave headroom for
          # the other services. Honoured by `docker compose up` (Compose v2).
          cpus: "6"
          memory: 8G

  postgis:
    image: postgis/postgis:16-3.4-alpine
    command:
      - "postgres"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G

  # Pull the model on startup (one-shot init container)
  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_started
    restart: "no"
    entrypoint: ["sh", "-c", "curl -sf http://ollama:11434/api/pull -d '{\"name\":\"qwen2.5:1.5b\"}' || true"]

  # Python services
  watcher:
    build: .
    command: python -u -m services.watcher
    volumes:
      - ./data:/app/data
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - DATA_DIR=/app/data
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  es-inserter:
    build: .
    command: python -u -m services.es_inserter
    volumes:
      - ./models:/app/models
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - ENABLE_VECTORS=false
      - TRANSFORMERS_CACHE=/app/models
      - MAX_CONCURRENT_BATCHES=2
    depends_on:
      nats:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  postgis-inserter:
    build: .
    command: python -u -m services.postgis_inserter
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      nats:
        condition: service_started
      postgis:
        condition: service_healthy
    restart: unless-stopped

  geocoder:
    build: .
    command: python -u -m services.geocoder
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - ENABLE_VECTORS=false
      # AI place descriptions (/describe, ?describe=true) via Ollama. Vectors stay
      # off — descriptions don't need them and they'd add ES/CPU load per query.
      - ENABLE_AI=true
      - TRANSFORMERS_CACHE=/app/models
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # uvicorn worker processes per container (the geocoder is stateless, so it
      # also scales horizontally via replicas). Tune to leave CPU for ES.
      - GEOCODER_WORKERS=${GEOCODER_WORKERS:-4}
      # Deep forward/reverse geocoding via Google Maps. Set GOOGLE_MAPS_API_KEY
      # in your environment or .env; ENABLE_DEEP gates the /deep/* endpoints.
      - ENABLE_DEEP=${ENABLE_DEEP:-true}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      # Live traffic: enables the /traffic/probe(s) + /traffic/edge endpoints.
      # VALHALLA_URL is used to snap probe points to road edges.
      - ENABLE_TRAFFIC=${ENABLE_TRAFFIC:-true}
      - VALHALLA_URL=http://valhalla:8002
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgis:
        condition: service_healthy
      nats:
        condition: service_started
      ollama:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Valhalla routing engine.
  #
  # Uses the gis-ops "docker-valhalla" image. path_extension=valhalla scopes the
  # image's working dir to /custom_files/valhalla, so everything Valhalla builds
  # (valhalla_tiles/, valhalla_tiles.tar, valhalla.json, admin_data/,
  # timezone_data/, traffic.tar, file_hashes.txt) lives under ./data/valhalla —
  # alongside ./data/geonames and ./data/openaddresses — instead of the top of
  # ./data. The traffic.tar in there is shared with traffic-writer.
  #
  # The OSM extracts themselves stay at the top of ./data (the watcher and other
  # services read them there). configure_valhalla.sh discovers PBFs with
  # `ls $CUSTOM_FILES/*.pbf`, which follows symlinks, so the downloader drops a
  # relative symlink ./data/valhalla/<name>.pbf -> ../<name>.pbf for every PBF
  # it saves; the graph is built from ALL of them and the image rebuilds when it
  # detects a new PBF set.
  #
  # The routing API listens on 8002 inside the container; we publish it on the
  # host as 8001 (the geocoder is on 8000). Endpoints: /route, /optimized_route,
  # /sources_to_targets (matrix), /isochrone, /locate, /status.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    ports:
      - "127.0.0.1:8001:8002"
    volumes:
      - ./data:/custom_files
    environment:
      # Keep all of Valhalla's generated files in ./data/valhalla (see the
      # service comment); the PBFs are reached via symlinks in that dir.
      - path_extension=valhalla
      # Build the graph from the bundled PBF rather than downloading tiles.
      - use_tiles_ignore_pbf=False
      - tile_urls=
      # Don't rebuild on every start; reuse tiles already in the named volume.
      - force_rebuild=False
      - force_rebuild_elevation=False
      # Admin + time-zone DBs improve country-crossing, turn rules and ETAs.
      - build_admins=True
      - build_time_zones=True
      # Elevation/transit pull large extra datasets; off by default.
      - build_elevation=False
      - build_transit=False
      # Build the memory-mapped traffic extract that the traffic-writer updates
      # in place to feed live traffic into routing. The image appends ".tar"
      # itself, so "traffic" yields traffic.tar (the old traffic_name=traffic.tar
      # produced traffic.tar.tar).
      - traffic_name=traffic
      - build_tar=True
      - serve_tiles=True
      - server_threads=4
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      # A full graph build from the PBF (first boot, new PBF set, or wiped
      # data/valhalla) takes 15-20+ min for Egypt; don't mark unhealthy while
      # it runs, or `up` waits on service_healthy will fail mid-build.
      start_period: 18000s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Live traffic pipeline ──────────────────────────────────────────────────
  # traffic-aggregator: consumes GPS probes (NATS traffic.probes) from app users,
  # map-matches them to Valhalla edges, and keeps a smoothed per-edge speed in
  # Redis. Optionally augments with an external flow provider (TRAFFIC_PROVIDER).
  traffic-aggregator:
    build: .
    command: python -u -m services.traffic_aggregator
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - VALHALLA_URL=http://valhalla:8002
      - TRAFFIC_MIN_SAMPLES=${TRAFFIC_MIN_SAMPLES:-3}
      - TRAFFIC_EDGE_TTL=${TRAFFIC_EDGE_TTL:-600}
      - TRAFFIC_EWMA_ALPHA=${TRAFFIC_EWMA_ALPHA:-0.3}
      # Optional external flow provider (gap-filler / cold-start). "none" disables it;
      # "tomtom" needs TOMTOM_API_KEY (free tier). Probe data always takes priority.
      - TRAFFIC_PROVIDER=${TRAFFIC_PROVIDER:-none}
      - TOMTOM_API_KEY=${TOMTOM_API_KEY:-}
      - TRAFFIC_PROVIDER_BBOX=${TRAFFIC_PROVIDER_BBOX:-29.7,31.0,30.2,31.5}
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    restart: unless-stopped

  # traffic-writer: writes the Redis per-edge speeds into Valhalla's
  # memory-mapped traffic.tar, in place. Shares Valhalla's /custom_files (the
  # ./data bind) so the running router sees updates with no restart.
  traffic-writer:
    build: .
    command: python -u -m services.traffic_writer
    # Shares Valhalla's /custom_files (the ./data bind) so it writes the same
    # traffic.tar the routing engine serves (under data/valhalla/, where
    # path_extension=valhalla puts it).
    volumes:
      - ./data:/custom_files
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TRAFFIC_EXTRACT_PATH=/custom_files/valhalla/traffic.tar
      - TRAFFIC_WRITE_INTERVAL=${TRAFFIC_WRITE_INTERVAL:-30}
      - TRAFFIC_EDGE_TTL=${TRAFFIC_EDGE_TTL:-600}
    depends_on:
      redis:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    restart: unless-stopped

  oa-watcher:
    build: .
    command: python -u -m services.oa_watcher
    volumes:
      - ./data:/app/data
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - OA_DATA_DIR=/app/data/openaddresses
    depends_on:
      nats:
        condition: service_started
    restart: unless-stopped

  gn-watcher:
    build: .
    command: python -u -m services.gn_watcher
    volumes:
      - ./data:/app/data
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - GN_DATA_DIR=/app/data/geonames
    depends_on:
      nats:
        condition: service_started
    restart: unless-stopped

  # Imports curated place JSON exports dropped into ./data/places (Pelias google
  # POIs + Postgres `places` dumps). Maps each record to the watcher OSM-element
  # format and publishes to NATS; a .processed ledger stops re-import on restart.
  places-watcher:
    build: .
    command: python -u -m services.places_watcher
    volumes:
      - ./data:/app/data
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - PLACES_DATA_DIR=/app/data/places
    depends_on:
      nats:
        condition: service_started
    restart: unless-stopped

  downloader:
    build: .
    command: python -u -m services.downloader
    volumes:
      - ./data:/app/data
    environment:
      - osm_url=https://download.geofabrik.de/africa/egypt-latest.osm.pbf
      - OA_URL=
      - GN_URL=
      - DATA_DIR=/app/data
    restart: "no"

  # ── cleaner (DESTRUCTIVE — DISABLED by default) ──────────────────────────
  # This service WIPES ALL DATA on start: drops the PostGIS osm_geometries /
  # osm_addresses tables, deletes the ES osm_places index, and deletes the NATS
  # OSM stream. It was previously part of the default stack, so every
  # `docker compose up` silently nuked the dataset. It is commented out so a
  # normal `up` can never wipe data.
  #
  # To run it intentionally (full reset), temporarily uncomment and run:
  #     docker compose run --rm cleaner
  # then re-comment it.
  #
  # cleaner:
  #   build: .
  #   command: python -u -m services.cleaner
  #   environment:
  #     - ELASTICSEARCH_URL=http://elasticsearch:9200
  #     - POSTGRES_HOST=postgis
  #     - POSTGRES_PORT=5432
  #     - POSTGRES_DB=postgres
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #     - NATS_URL=nats://nats:4222
  #     - NATS_STREAM=OSM
  #     - NATS_SUBJECT=osm.elements
  #   depends_on:
  #     elasticsearch:
  #       condition: service_healthy
  #     postgis:
  #       condition: service_healthy
  #     nats:
  #       condition: service_started
  #   restart: "no"

  # ── API-key management / metering / billing subsystem ──────────────────────
  # Identity (Zitadel) + its database, the control plane (management API), the
  # metered gateway (data plane), a one-shot Zitadel provisioner, and the React
  # console. See billing/README.md.

  zitadel-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=zitadel
      - POSTGRES_PASSWORD=zitadel
      - POSTGRES_DB=zitadel
    volumes:
      - zitadel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    command: 'start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled'
    environment:
      - ZITADEL_DATABASE_POSTGRES_HOST=zitadel-db
      - ZITADEL_DATABASE_POSTGRES_PORT=5432
      - ZITADEL_DATABASE_POSTGRES_DATABASE=zitadel
      - ZITADEL_DATABASE_POSTGRES_USER_USERNAME=zitadel
      - ZITADEL_DATABASE_POSTGRES_USER_PASSWORD=zitadel
      - ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE=disable
      - ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME=zitadel
      - ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD=zitadel
      - ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE=disable
      - ZITADEL_EXTERNALSECURE=false
      - ZITADEL_EXTERNALDOMAIN=localhost
      - ZITADEL_EXTERNALPORT=8085
      - ZITADEL_TLS_ENABLED=false
      # Bootstrap human admin (logs into the console / Zitadel UI).
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME=zitadel-admin@zitadel.localhost
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD=Password1!
      - ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED=false
      # Service account + PAT (written to the shared volume) for provisioning.
      - ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME=svc-billing
      - ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME=Billing Service Account
      # A PAT is only generated when an expiration date is set.
      - ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE=2031-01-01T00:00:00Z
      - ZITADEL_FIRSTINSTANCE_PATPATH=/machinekey/pat.txt
    volumes:
      # Bind mount (world-writable on host) so the non-root zitadel user can
      # write the service-account PAT; the init container reads it back.
      - ./billing/.zitadel-machinekey:/machinekey
    ports:
      # Host-private: reach it via the reverse proxy (nginx/Istio terminates TLS).
      - "127.0.0.1:8085:8080"
    depends_on:
      zitadel-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  billing-control-plane:
    build:
      context: .
      dockerfile: billing/Dockerfile
    command: uvicorn billing.main:control_plane_app --host 0.0.0.0 --port 8100
    ports:
      # Host-private: the SPA reaches it through the reverse proxy (HTTPS).
      - "127.0.0.1:8100:8100"
    environment:
      - BILLING_PG_HOST=postgis
      - BILLING_PG_PORT=5432
      - BILLING_PG_DB=billing
      - BILLING_PG_USER=postgres
      - BILLING_PG_PASSWORD=postgres
      - BILLING_REDIS_HOST=redis
      - BILLING_REDIS_PORT=6379
      - BILLING_REDIS_DB=1
      # AUTH: "dev" (built-in /auth/login) or "zitadel" (verify OIDC tokens).
      - BILLING_AUTH_MODE=${BILLING_AUTH_MODE:-zitadel}
      - ZITADEL_ISSUER=http://localhost:8085
      # JWKS is fetched over the internal network; Host override resolves the instance.
      - ZITADEL_JWKS_URL=http://zitadel:8080/oauth/v2/keys
      - ZITADEL_HOST_HEADER=localhost:8085
      - ZITADEL_API_URL=http://zitadel:8080
      # ZITADEL_PROJECT_ID + ZITADEL_SERVICE_TOKEN are read from the shared
      # volumes written by billing-zitadel-init (config.json + pat.txt), so
      # .env no longer needs to be updated after provisioning.
      - ZITADEL_PAT_FILE=/machinekey/pat.txt
      # APISIX data-plane provisioning (consumers/groups) + usage-sink wiring.
      - APISIX_ADMIN_URL=http://apisix:9180
      - APISIX_ADMIN_KEY=billing-apisix-admin-key-change-me
      - APISIX_UPSTREAM=geocoder:8000
      - USAGE_SINK_URL=http://billing-control-plane:8100/internal/usage?token=sink-secret
      - USAGE_SINK_SECRET=sink-secret
      - BILLING_KEY_ENC_SECRET=${BILLING_KEY_ENC_SECRET:-dev-key-encryption-secret-change-me}
    volumes:
      # Read projectId from config.json written by billing-zitadel-init.
      - billing-frontend-config:/runtime:ro
      # Read PAT (service token) from the same machinekey written by Zitadel.
      - ./billing/.zitadel-machinekey:/machinekey:ro
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      billing-zitadel-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # etcd: APISIX's configuration store (routes, consumers, plugins).
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    volumes:
      - etcd-data:/etcd-data
    deploy:
      resources:
        limits:
          memory: 512M

  # Apache APISIX: the distributed, metered data plane (replaces the interim
  # custom FastAPI gateway). key-auth validates X-API-Key against per-key
  # consumers; per-tenant consumer-groups carry limit-count(redis) for
  # cluster-wide hard quotas; http-logger streams usage to the control plane's
  # /internal/usage sink (→ Redis live counters + event list → Postgres rollups).
  apisix:
    image: apache/apisix:3.9.1-debian
    volumes:
      - ./billing/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      # Host-private: the metered API is exposed via the reverse proxy (HTTPS).
      - "127.0.0.1:8080:9080"    # proxy (metered API entrypoint)
      - "127.0.0.1:9180:9180"    # admin API
    depends_on:
      etcd:
        condition: service_started
      geocoder:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # Drains the Redis usage-event list into Postgres rollups (the aggregator).
  billing-aggregator:
    build:
      context: .
      dockerfile: billing/Dockerfile
    command: python -u -m billing.aggregator
    environment:
      - BILLING_PG_HOST=postgis
      - BILLING_PG_DB=billing
      - BILLING_PG_USER=postgres
      - BILLING_PG_PASSWORD=postgres
      - BILLING_REDIS_HOST=redis
      - BILLING_REDIS_PORT=6379
      - BILLING_REDIS_DB=1
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: provision the Zitadel project, roles and SPA client, then write
  # the frontend's runtime config (issuer + clientId) into the shared volume.
  billing-zitadel-init:
    build:
      context: .
      dockerfile: billing/Dockerfile
    command: python -u -m billing.provision_zitadel
    environment:
      - ZITADEL_API_URL=http://zitadel:8080
      - ZITADEL_HOST_HEADER=localhost:8085
      - ZITADEL_PAT_FILE=/machinekey/pat.txt
      - PROVISION_OUT=/out/config.json
      - SPA_REDIRECT_URIS=http://localhost:8088/callback,http://localhost:8088/
      - SPA_LOGOUT_URIS=http://localhost:8088/
    volumes:
      - ./billing/.zitadel-machinekey:/machinekey:ro
      - billing-frontend-config:/out
    depends_on:
      zitadel:
        condition: service_started
    restart: "no"

  billing-frontend:
    build:
      context: ./billing/frontend
      args:
        # Local dev serves the console at the origin root (localhost:8088). The
        # public override rebuilds it under /console (see _docker-compose.override).
        BASE_PATH: "/"
    ports:
      # Host-private: served to users through the reverse proxy (HTTPS).
      - "127.0.0.1:8088:80"
    volumes:
      # runtime config.json written by billing-zitadel-init, served at /runtime/
      - billing-frontend-config:/usr/share/nginx/html/runtime:ro
    depends_on:
      billing-control-plane:
        condition: service_started
    restart: unless-stopped

volumes:
  nats-data:
  redis-data:
  elasticsearch-data:
  postgis-data:
  ollama-data:
  zitadel-db-data:
  etcd-data:
  billing-frontend-config:

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-js -sd /data -m 8222"
    volumes:
      - nats-data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ETCD_NAME=etcd0
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster
      - ETCD_INITIAL_CLUSTER_STATE=new
    volumes:
      - etcd-data:/etcd-data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  typesense:
    image: typesense/typesense:27.1
    ports:
      - "8108:8108"
    command: "--enable-cors"
    environment:
      - TYPESENSE_API_KEY=typesense-secret-key
      - TYPESENSE_DATA_DIR=/data
    volumes:
      - typesense-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8108 && echo -e \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \"200\"'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgis:
    image: postgis/postgis:16-3.4-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python services
  watcher:
    build: .
    command: python -u -m services.watcher
    volumes:
      - ./data:/app/data
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - DATA_DIR=/app/data
      - ETCD_HOST=etcd
      - ETCD_PORT=2379
    depends_on:
      nats:
        condition: service_started
      etcd:
        condition: service_started
    restart: unless-stopped

  es-inserter:
    build: .
    command: python -u -m services.es_inserter
    volumes:
      - ./models:/app/models
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - ENABLE_VECTORS=false
      - TRANSFORMERS_CACHE=/app/models
    depends_on:
      nats:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  ts-inserter:
    build: .
    command: python -u -m services.ts_inserter
    volumes:
      - ./models:/app/models
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_API_KEY=typesense-secret-key
      - EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - ENABLE_VECTORS=false
      - TRANSFORMERS_CACHE=/app/models
    depends_on:
      nats:
        condition: service_started
      typesense:
        condition: service_healthy
    restart: unless-stopped

  postgis-inserter:
    build: .
    command: python -u -m services.postgis_inserter
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      nats:
        condition: service_started
      postgis:
        condition: service_healthy
    restart: unless-stopped

  geocoder:
    build: .
    command: python -u -m services.geocoder
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_API_KEY=typesense-secret-key
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - ENABLE_VECTORS=false
      - ENABLE_AI=false
      - TRANSFORMERS_CACHE=/app/models
    depends_on:
      elasticsearch:
        condition: service_healthy
      typesense:
        condition: service_healthy
      postgis:
        condition: service_healthy
    restart: unless-stopped

  downloader:
    build: .
    command: python -u -m services.downloader
    volumes:
      - ./data:/app/data
    environment:
      - osm_url=https://download.geofabrik.de/africa/egypt-latest.osm.pbf
      - DATA_DIR=/app/data
    restart: "no"

  cleaner:
    build: .
    command: python -u -m services.cleaner
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_API_KEY=typesense-secret-key
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
    depends_on:
      elasticsearch:
        condition: service_healthy
      typesense:
        condition: service_healthy
      postgis:
        condition: service_healthy
      nats:
        condition: service_started
    restart: "no"

volumes:
  pip-data:
  nats-data:
  etcd-data:
  elasticsearch-data:
  typesense-data:
  postgis-data:

services:
  nats:
    image: nats:2.10
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-c /etc/nats/nats.conf"
    volumes:
      - nats-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G

  postgis:
    image: postgis/postgis:16-3.4-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G

  # Pull the model on startup (one-shot init container)
  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_started
    restart: "no"
    entrypoint: ["sh", "-c", "curl -sf http://ollama:11434/api/pull -d '{\"name\":\"qwen2.5:1.5b\"}' || true"]

  # Python services
  watcher:
    build: .
    command: python -u -m services.watcher
    volumes:
      - ./data:/app/data
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - DATA_DIR=/app/data
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  es-inserter:
    build: .
    command: python -u -m services.es_inserter
    volumes:
      - ./models:/app/models
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - ENABLE_VECTORS=false
      - TRANSFORMERS_CACHE=/app/models
      - MAX_CONCURRENT_BATCHES=2
    depends_on:
      nats:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  postgis-inserter:
    build: .
    command: python -u -m services.postgis_inserter
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      nats:
        condition: service_started
      postgis:
        condition: service_healthy
    restart: unless-stopped

  geocoder:
    build: .
    command: python -u -m services.geocoder
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - ENABLE_VECTORS=false
      - ENABLE_AI=false
      - TRANSFORMERS_CACHE=/app/models
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgis:
        condition: service_healthy
      nats:
        condition: service_started
      ollama:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  oa-watcher:
    build: .
    command: python -u -m services.oa_watcher
    volumes:
      - ./data:/app/data
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - OA_DATA_DIR=/app/data/openaddresses
    depends_on:
      nats:
        condition: service_started
    restart: "no"

  gn-watcher:
    build: .
    command: python -u -m services.gn_watcher
    volumes:
      - ./data:/app/data
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - GN_DATA_DIR=/app/data/geonames
    depends_on:
      nats:
        condition: service_started
    restart: "no"

  downloader:
    build: .
    command: python -u -m services.downloader
    volumes:
      - ./data:/app/data
    environment:
      - osm_url=https://download.geofabrik.de/africa/egypt-latest.osm.pbf
      - OA_URL=
      - GN_URL=
      - DATA_DIR=/app/data
    restart: "no"

  # ── cleaner (DESTRUCTIVE — DISABLED by default) ──────────────────────────
  # This service WIPES ALL DATA on start: drops the PostGIS osm_geometries /
  # osm_addresses tables, deletes the ES osm_places index, and deletes the NATS
  # OSM stream. It was previously part of the default stack, so every
  # `docker compose up` silently nuked the dataset. It is commented out so a
  # normal `up` can never wipe data.
  #
  # To run it intentionally (full reset), temporarily uncomment and run:
  #     docker compose run --rm cleaner
  # then re-comment it.
  #
  # cleaner:
  #   build: .
  #   command: python -u -m services.cleaner
  #   environment:
  #     - ELASTICSEARCH_URL=http://elasticsearch:9200
  #     - POSTGRES_HOST=postgis
  #     - POSTGRES_PORT=5432
  #     - POSTGRES_DB=postgres
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #     - NATS_URL=nats://nats:4222
  #     - NATS_STREAM=OSM
  #     - NATS_SUBJECT=osm.elements
  #   depends_on:
  #     elasticsearch:
  #       condition: service_healthy
  #     postgis:
  #       condition: service_healthy
  #     nats:
  #       condition: service_started
  #   restart: "no"

volumes:
  nats-data:
  redis-data:
  elasticsearch-data:
  postgis-data:
  ollama-data:

[ADDR_FIELD_MAP]
"housenumber" = "addr:housenumber"
"street" = "addr:street"
"suburb" = "addr:suburb"
"district" = "addr:district"
"city" = "addr:city"
"postcode" = "addr:postcode"
"state" = "addr:state"
"country" = "addr:country"
"place" = "addr:place"
"unit" = "addr:unit"
"floor" = "addr:floor"

# Abbreviation and synonym expansion (English).
[_EN_ABBREVS]
"st" = "street"
"str" = "street"
"rd" = "road"
"ave" = "avenue"
"av" = "avenue"
"blvd" = "boulevard"
"bvd" = "boulevard"
"ln" = "lane"
"dr" = "drive"
"pl" = "place"
"ct" = "court"
"sq" = "square"
"hwy" = "highway"
"cres" = "crescent"
"terr" = "terrace"
"pkwy" = "parkway"

# Arabic street-type words mapped to their English equivalent.

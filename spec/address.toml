# Ordinal expansion (5th <-> fifth) so both spellings find each other.
# Deliberately narrow: only EXPLICIT ordinals expand. A bare "5" is never
# touched — it is a house number, and "District 5" is a genuinely different
# place from "Fifth District", so conflating them would corrupt recall.
"_ORDINAL_WORDS" = [
  "zeroth",
  "first",
  "second",
  "third",
  "fourth",
  "fifth",
  "sixth",
  "seventh",
  "eighth",
  "ninth",
  "tenth",
  "eleventh",
  "twelfth",
  "thirteenth",
  "fourteenth",
  "fifteenth",
  "sixteenth",
  "seventeenth",
  "eighteenth",
  "nineteenth",
  "twentieth",
]

# Structured query field -> OSM addr:* tag.

# Place-record mapping specification
#
# THIS FILE IS SPECIFICATION, NOT CONFIGURATION. See shared/spec.py.
#
# Curated place exports (a Pelias/Google export and a Postgres `places` dump)
# arrive with their own vocabulary. These tables map each source layer or
# category onto the OSM feature tag the rest of the pipeline speaks, so a
# curated record and an OSM record rank by the same rules.

"_PELIAS_PROMOTED_PARENT" = [
  "borough",
  "country",
  "country_a",
  "county",
  "localadmin",
  "locality",
  "macroregion",
  "neighbourhood",
  "postalcode",
  "region",
  "region_a",
]
"_ADDRESS_KEYS" = [
  "full",
  "street",
  "suburb",
  "district",
  "city",
  "state",
  "postcode",
  "country",
  "country_code",
  "state_code",
]


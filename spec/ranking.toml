# Ranking specification — offline importance scoring
#
# THIS FILE IS SPECIFICATION, NOT CONFIGURATION.
#
# Every number here is a tuning decision that cannot be re-derived from the
# architecture. `shared/ranking.py` is thin logic that reads this file; the
# knowledge lives here so a regenerated implementation produces the same
# ranking instead of inventing its own.
#
# Changing any value changes search results. Measure against
# docs/quality-baseline.md before and after — see AD-9 in the geocoder spine.
#
# Model: each signal scores 0..1, is multiplied by its weight below, and the
# weighted sum is normalised by the total weight of the signals that APPLIED,
# then scaled to 0..10. Signals that do not apply to an element (area on a
# point, admin_level on a non-boundary) are excluded from the denominator so
# points are not systematically penalised.

[weights]
# admin_level and area dominate for boundaries and polygons.
# poi merges venue/building/office/named-floor via max() to avoid double count.
admin = 5.0
area = 4.0
place = 2.5
population = 1.5
highway = 1.5
natural = 1.0
metadata = 0.5
landuse = 1.0
poi = 1.0
brand = 0.3

[scalars]
# admin_level 2 (country) scores 1.0, decaying per level: 4 -> 0.80, 10 -> 0.20.
admin_decay_per_level = 0.10
admin_base_level = 2
# log10(population) / divisor, capped at 1.0. 10M -> ~1.0, 1000 -> ~0.43.
population_log_divisor = 7.0
# (log10(area_km2) + offset) / divisor, clamped. 10000 km2 -> 1.0, 0.01 -> 0.
area_log_offset = 2.0
area_log_divisor = 6.0
# Wikidata and Wikipedia presence each contribute half the metadata signal.
metadata_wikidata = 0.5
metadata_wikipedia = 0.5
# An office type not in the table still outranks a bare node.
office_unknown_floor = 0.30
# A named POI with real-place evidence never sits at 0.
named_poi_floor = 0.25

[keys]
# Tag keys consulted for the venue signal; the highest scoring one wins.
venue_tags = ["amenity", "shop", "leisure", "tourism", "aeroway"]
# Presence of any of these is evidence a named element is a real curated POI,
# which gates the named_poi_floor so trivially-named bare nodes are not lifted.
poi_evidence = ["source", "phone", "website", "rating", "opening_hours", "brand", "operator", "ref:google_place_id", "ref:source_id"]


# Category specification — what an OSM element *is*
#
# THIS FILE IS SPECIFICATION, NOT CONFIGURATION. See shared/spec.py.
#
# Converted from JSON after the regeneration experiment: a rebuild from the JSON
# version diverged on 174 of 261 cases, because JSON cannot carry comments and
# every ordering rule had stayed behind in Python. The rules are in
# CLASSIFY_RULES below, and the reasoning now travels with the data.

# Tag keys consulted when classifying, in PRECEDENCE ORDER: the first key
# present wins, which is why amenity beats building for a restaurant also
# tagged building=yes.
"CATEGORY_KEYS" = [
  "amenity",
  "shop",
  "tourism",
  "leisure",
  "office",
  "historic",
  "building",
  "place",
  "natural",
  "highway",
  "railway",
  "aeroway",
  "waterway",
  "landuse",
]
# Keys whose values become free-text type-search terms.
"CATEGORY_TEXT_KEYS" = [
  "amenity",
  "shop",
  "tourism",
  "leisure",
  "office",
  "historic",
  "healthcare",
  "emergency",
  "cuisine",
  "railway",
  "station",
  "public_transport",
  "aeroway",
]
# Values that carry no meaning on their own (building=yes).
"JUNK_VALUES" = ["yes", "no", "true", "false", "unknown", "none"]


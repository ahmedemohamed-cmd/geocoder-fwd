[GROUP_DEFS.transport]
"aeroway" = ["aerodrome", "terminal"]
"railway" = ["station", "halt", "subway_entrance", "tram_stop"]
"amenity" = ["bus_station", "taxi", "ferry_terminal", "bicycle_rental"]
"highway" = ["bus_stop"]

# Fallback when a value is not listed in GROUP_DEFS: the key alone implies a
# group, so an unknown shop=* is still shopping.
[GROUP_BY_KEY]
"shop" = "shopping"
"tourism" = "lodging_tourism"
"leisure" = "leisure"
"historic" = "lodging_tourism"
"aeroway" = "transport"
"railway" = "transport"

# Features that are PART OF a place rather than a place. A railway=station is a
# destination; its subway_entrance doorways are not — OSM models every
# street-level entrance as its own node, named after the street it opens onto.
# Left searchable they swamp the real thing: within 50km of Vaughan the index
# holds 245 subway_entrance nodes against 68 stations. Near Cairo it holds 2
# against 88, which is exactly why this was invisible on an Egypt-only index.
# Excluded from category_text ONLY — they keep their key/value so /nearby can
# still filter for them deliberately.
[_SUBFEATURE_TAGS]
"railway" = ["construction", "disused", "elevator", "platform", "proposed", "subway_entrance"]
"public_transport" = ["platform", "stop_position"]

# "key=value" -> extra search terms. The raw value is always emitted anyway,

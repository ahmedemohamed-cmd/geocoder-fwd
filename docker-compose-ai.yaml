services:
  nats:
    image: nats:2.10
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-c /etc/nats/nats.conf"
    volumes:
      - nats-data:/data
      - ./nats.conf:/etc/nats/nats.conf:ro
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    # Redis here is a pure derived cache (autocomplete index, rebuilt from ES
    # every 10 min; watcher node-coord cache during ingest). It needs NO
    # persistence — and the default RDB background-save fork during the
    # autocomplete warm-up write storm caused a copy-on-write memory spike that
    # OOM-killed the container (exit 137). So: disable RDB+AOF, and cap maxmemory
    # below the container limit with LRU eviction so Redis evicts instead of dying.
    command: >
      redis-server --save "" --appendonly no
      --maxmemory 850mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 3G

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          # Cap ES CPU so bulk indexing / query bursts can't monopolise the host.
          # Heap is fixed at 4g (ES_JAVA_OPTS); tune `cpus` to leave headroom for
          # the other services. Honoured by `docker compose up` (Compose v2).
          cpus: "6"
          memory: 8G

  postgis:
    image: postgis/postgis:16-3.4-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Pull the model on startup (one-shot init container)
  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_started
    restart: "no"
    entrypoint: ["sh", "-c", "curl -sf http://ollama:11434/api/pull -d '{\"name\":\"qwen2.5:1.5b\"}' || true"]

  # Python services
  watcher:
    build: .
    command: python -u -m services.watcher
    volumes:
      - ./data:/app/data
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - DATA_DIR=/app/data
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  es-inserter:
    build: .
    command: python -u -m services.es_inserter
    volumes:
      - ./models:/app/models
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - EMBEDDING_MODEL=/app/models/paraphrase-multilingual-MiniLM-L12-v2
      - ENABLE_VECTORS=true
      - TRANSFORMERS_CACHE=/app/models
      - HF_HOME=/app/models
      # Limit concurrent indexing batches so bulk ingest doesn't saturate ES CPU.
      - MAX_CONCURRENT_BATCHES=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      nats:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  postgis-inserter:
    build: .
    command: python -u -m services.postgis_inserter
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      nats:
        condition: service_started
      postgis:
        condition: service_healthy
    restart: unless-stopped

  geocoder:
    build: .
    command: python -u -m services.geocoder
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - EMBEDDING_MODEL=/app/models/paraphrase-multilingual-MiniLM-L12-v2
      - ENABLE_VECTORS=true
      - ENABLE_AI=true
      - TRANSFORMERS_CACHE=/app/models
      - HF_HOME=/app/models
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # uvicorn worker processes per container (the geocoder is stateless, so it
      # also scales horizontally via replicas). Tune to leave CPU for ES.
      - GEOCODER_WORKERS=${GEOCODER_WORKERS:-4}
      # Deep forward/reverse geocoding via Google Maps. Set GOOGLE_MAPS_API_KEY
      # in your environment or .env; ENABLE_DEEP gates the /deep/* endpoints.
      - ENABLE_DEEP=${ENABLE_DEEP:-true}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgis:
        condition: service_healthy
      nats:
        condition: service_started
      ollama:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Valhalla routing engine.
  #
  # Uses the gis-ops "docker-valhalla" image, which on first start scans
  # /custom_files for *.osm.pbf, builds the routing graph (tiles), then serves
  # the routing API. We bind the existing data/egypt-latest.osm.pbf read-only
  # into /custom_files and keep the built tiles + config in a named volume, so
  # the build only happens once and survives restarts (force_rebuild=False).
  #
  # The routing API listens on 8002 inside the container; we publish it on the
  # host as 8001 (the geocoder is on 8000). Endpoints: /route, /optimized_route,
  # /sources_to_targets (matrix), /isochrone, /locate, /status.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    ports:
      - "8001:8002"
    volumes:
      - valhalla-tiles:/custom_files
      - ./data/egypt-latest.osm.pbf:/custom_files/egypt-latest.osm.pbf:ro
    environment:
      # Build the graph from the bundled PBF rather than downloading tiles.
      - use_tiles_ignore_pbf=False
      - tile_urls=
      # Don't rebuild on every start; reuse tiles already in the named volume.
      - force_rebuild=False
      - force_rebuild_elevation=False
      # Admin + time-zone DBs improve country-crossing, turn rules and ETAs.
      - build_admins=True
      - build_time_zones=True
      # Elevation/transit pull large extra datasets; off by default.
      - build_elevation=False
      - build_transit=False
      - serve_tiles=True
      - server_threads=4
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      # First boot builds the graph from the PBF, which can take several
      # minutes; don't mark unhealthy while that initial build is running.
      start_period: 600s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  oa-watcher:
    build: .
    command: python -u -m services.oa_watcher
    volumes:
      - ./data:/app/data
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - OA_DATA_DIR=/app/data/openaddresses
    depends_on:
      nats:
        condition: service_started
    restart: "no"

  gn-watcher:
    build: .
    command: python -u -m services.gn_watcher
    volumes:
      - ./data:/app/data
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
      - GN_DATA_DIR=/app/data/geonames
    depends_on:
      nats:
        condition: service_started
    restart: "no"

  downloader:
    build: .
    command: python -u -m services.downloader
    volumes:
      - ./data:/app/data
    environment:
      - osm_url=https://download.geofabrik.de/africa/egypt-latest.osm.pbf
      - OA_URL=
      - GN_URL=
      - DATA_DIR=/app/data
    restart: "no"

  cleaner:
    build: .
    command: python -u -m services.cleaner
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - NATS_URL=nats://nats:4222
      - NATS_STREAM=OSM
      - NATS_SUBJECT=osm.elements
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgis:
        condition: service_healthy
      nats:
        condition: service_started
    restart: "no"

volumes:
  nats-data:
  redis-data:
  elasticsearch-data:
  postgis-data:
  ollama-data:
  valhalla-tiles:

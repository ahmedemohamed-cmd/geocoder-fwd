{{- if .Values.esInserter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geocoder.fullname" . }}-es-inserter
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: es-inserter
spec:
  replicas: {{ .Values.esInserter.replicas }}
  selector:
    matchLabels:
      {{- include "geocoder.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: es-inserter
  template:
    metadata:
      labels:
        {{- include "geocoder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: es-inserter
    spec:
      {{- if and .Values.global.aiEnabled .Values.gpu.enabled }}
      {{- with .Values.gpu.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: es-inserter
          image: {{ include "geocoder.appImage" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: ["python", "-m", "services.es_inserter"]
          env:
            {{- include "geocoder.commonEnv" . | nindent 12 }}
            {{- include "geocoder.esEnv" . | nindent 12 }}
            {{- include "geocoder.embeddingEnv" . | nindent 12 }}
          {{- if .Values.global.aiEnabled }}
          volumeMounts:
            {{- include "geocoder.modelVolumeMount" . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              {{- with .Values.esInserter.resources.requests }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            limits:
              {{- with .Values.esInserter.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
              {{- include "geocoder.gpuResources" . | nindent 14 }}
      {{- if .Values.global.aiEnabled }}
      volumes:
        {{- include "geocoder.modelVolume" . | nindent 8 }}
      {{- end }}
{{- end }}

{{- if and .Values.global.autoDownload .Values.downloader.enabled }}
# Job to automatically trigger downloader and watcher on deployment
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "geocoder.fullname" . }}-auto-download
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: auto-download
spec:
  template:
    metadata:
      labels:
        {{- include "geocoder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: post-install
    spec:
      restartPolicy: OnFailure
      containers:
        - name: downloader
          image: {{ include "geocoder.appImage" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: ["python", "-u", "-m", "services.downloader"]
          env:
            {{- include "geocoder.commonEnv" . | nindent 12 }}
            - name: DATA_DIR
              value: "/app/data"
            - name: osm_url
              value: {{ .Values.osm.url | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "geocoder.fullname" . }}-data
{{- end }}
---
{{- if and .Values.global.autoDownload .Values.downloader.enabled }}
# Job for watcher (runs after downloader)
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "geocoder.fullname" . }}-auto-watcher
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: auto-watcher
spec:
  template:
    metadata:
      labels:
        {{- include "geocoder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: post-install
    spec:
      restartPolicy: OnFailure
      containers:
        - name: watcher
          image: {{ include "geocoder.appImage" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: ["python", "-u", "-m", "services.watcher"]
          env:
            {{- include "geocoder.commonEnv" . | nindent 12 }}
            - name: DATA_DIR
              value: "/app/data"
            - name: osm_url
              value: {{ .Values.osm.url | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "geocoder.fullname" . }}-data
{{- end }}
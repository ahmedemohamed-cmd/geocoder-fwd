{{- if .Values.etcd.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "geocoder.fullname" . }}-etcd
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: etcd
spec:
  ports:
    - name: client
      port: {{ .Values.etcd.service.clientPort }}
      targetPort: client
    - name: peer
      port: {{ .Values.etcd.service.peerPort }}
      targetPort: peer
  selector:
    {{- include "geocoder.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "geocoder.fullname" . }}-etcd
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: etcd
spec:
  serviceName: {{ include "geocoder.fullname" . }}-etcd
  replicas: 1
  selector:
    matchLabels:
      {{- include "geocoder.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: etcd
  template:
    metadata:
      labels:
        {{- include "geocoder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: etcd
    spec:
      containers:
        - name: etcd
          image: "{{ .Values.etcd.image.repository }}:{{ .Values.etcd.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: client
              containerPort: {{ .Values.etcd.service.clientPort }}
            - name: peer
              containerPort: {{ .Values.etcd.service.peerPort }}
          env:
            - name: ETCD_NAME
              value: etcd0
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: "http://{{ include "geocoder.fullname" . }}-etcd:{{ .Values.etcd.service.clientPort }}"
            - name: ETCD_LISTEN_CLIENT_URLS
              value: "http://0.0.0.0:{{ .Values.etcd.service.clientPort }}"
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: "http://{{ include "geocoder.fullname" . }}-etcd:{{ .Values.etcd.service.peerPort }}"
            - name: ETCD_LISTEN_PEER_URLS
              value: "http://0.0.0.0:{{ .Values.etcd.service.peerPort }}"
            - name: ETCD_INITIAL_CLUSTER
              value: "etcd0=http://{{ include "geocoder.fullname" . }}-etcd:{{ .Values.etcd.service.peerPort }}"
            - name: ETCD_INITIAL_CLUSTER_TOKEN
              value: etcd-cluster
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: new
            - name: ETCD_DATA_DIR
              value: /etcd-data
          volumeMounts:
            - name: data
              mountPath: /etcd-data
          resources:
            {{- toYaml .Values.etcd.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.etcd.persistence.size }}
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass | quote }}
        {{- end }}
{{- end }}

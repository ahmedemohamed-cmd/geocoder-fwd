{{- if .Values.tsInserter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geocoder.fullname" . }}-ts-inserter
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: ts-inserter
spec:
  replicas: {{ .Values.tsInserter.replicas }}
  selector:
    matchLabels:
      {{- include "geocoder.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ts-inserter
  template:
    metadata:
      labels:
        {{- include "geocoder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ts-inserter
    spec:
      {{- if and .Values.global.aiEnabled .Values.gpu.enabled }}
      {{- with .Values.gpu.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: ts-inserter
          image: {{ include "geocoder.appImage" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: ["python", "-m", "services.ts_inserter"]
          env:
            {{- include "geocoder.commonEnv" . | nindent 12 }}
            {{- include "geocoder.tsEnv" . | nindent 12 }}
            {{- include "geocoder.embeddingEnv" . | nindent 12 }}
          {{- if .Values.global.aiEnabled }}
          volumeMounts:
            {{- include "geocoder.modelVolumeMount" . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              {{- with .Values.tsInserter.resources.requests }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            limits:
              {{- with .Values.tsInserter.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
              {{- include "geocoder.gpuResources" . | nindent 14 }}
      {{- if .Values.global.aiEnabled }}
      volumes:
        {{- include "geocoder.modelVolume" . | nindent 8 }}
      {{- end }}
{{- end }}

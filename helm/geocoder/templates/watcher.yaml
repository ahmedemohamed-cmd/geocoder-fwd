{{- if .Values.watcher.enabled }}
{{- if .Values.watcher.runAsDeployment }}
# Watcher as a continuous Deployment — watches the data directory for new PBFs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geocoder.fullname" . }}-watcher
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "geocoder.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: watcher
  template:
    metadata:
      labels:
        {{- include "geocoder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: watcher
    spec:
      containers:
        - name: watcher
          image: {{ include "geocoder.appImage" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: ["python", "-m", "services.watcher"]
          env:
            {{- include "geocoder.commonEnv" . | nindent 12 }}
            - name: DATA_DIR
              value: "/app/data"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.watcher.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.dataVolume.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "geocoder.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- else }}
# Watcher as a CronJob — parses PBFs on the same monthly schedule
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "geocoder.fullname" . }}-watcher
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: watcher
spec:
  # Runs monthly per schedule (default: 00:30 on the 1st day of each month,
  # 30 minutes after the downloader to allow the download to complete)
  schedule: {{ .Values.watcher.schedule | quote }}
  concurrencyPolicy: {{ .Values.watcher.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.watcher.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.watcher.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "geocoder.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: watcher
        spec:
          restartPolicy: OnFailure
          containers:
            - name: watcher
              image: {{ include "geocoder.appImage" . }}
              imagePullPolicy: {{ .Values.app.image.pullPolicy }}
              command: ["python", "-m", "services.watcher"]
              env:
                {{- include "geocoder.commonEnv" . | nindent 16 }}
                - name: DATA_DIR
                  value: "/app/data"
              volumeMounts:
                - name: data
                  mountPath: /app/data
              resources:
                {{- toYaml .Values.watcher.resources | nindent 16 }}
          volumes:
            - name: data
              {{- if .Values.dataVolume.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "geocoder.fullname" . }}-data
              {{- else }}
              emptyDir: {}
              {{- end }}
{{- end }}
{{- end }}

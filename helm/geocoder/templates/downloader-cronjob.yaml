{{- if .Values.downloader.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "geocoder.fullname" . }}-downloader
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: downloader
spec:
  # Runs monthly per schedule (default: 00:00 on the 1st day of each month)
  schedule: {{ .Values.downloader.schedule | quote }}
  concurrencyPolicy: {{ .Values.downloader.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.downloader.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.downloader.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "geocoder.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: downloader
        spec:
          restartPolicy: OnFailure
          containers:
            - name: downloader
              image: {{ include "geocoder.appImage" . }}
              imagePullPolicy: {{ .Values.app.image.pullPolicy }}
              command: ["python", "-m", "services.downloader"]
              env:
                - name: osm_url
                  value: {{ .Values.osm.url | quote }}
                - name: DATA_DIR
                  value: "/app/data"
              volumeMounts:
                - name: data
                  mountPath: /app/data
              resources:
                {{- toYaml .Values.downloader.resources | nindent 16 }}
          volumes:
            - name: data
              {{- if .Values.dataVolume.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "geocoder.fullname" . }}-data
              {{- else }}
              emptyDir: {}
              {{- end }}
{{- end }}

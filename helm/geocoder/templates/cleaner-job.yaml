{{- if .Values.cleaner.enabled }}
# Manual cleaner Job — run with `helm upgrade --set cleaner.enabled=true` when needed
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "geocoder.fullname" . }}-cleaner-{{ .Release.Revision }}
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleaner
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "geocoder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cleaner
    spec:
      restartPolicy: Never
      containers:
        - name: cleaner
          image: {{ include "geocoder.appImage" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: ["python", "-m", "services.cleaner"]
          env:
            {{- include "geocoder.commonEnv" . | nindent 12 }}
            {{- include "geocoder.esEnv" . | nindent 12 }}
            {{- include "geocoder.tsEnv" . | nindent 12 }}
            {{- include "geocoder.postgisEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cleaner.resources | nindent 12 }}
{{- end }}

{{- if .Values.typesense.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "geocoder.fullname" . }}-typesense
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: typesense
spec:
  ports:
    - name: http
      port: {{ .Values.typesense.service.port }}
      targetPort: http
  selector:
    {{- include "geocoder.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: typesense
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "geocoder.fullname" . }}-typesense
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: typesense
spec:
  serviceName: {{ include "geocoder.fullname" . }}-typesense
  replicas: 1
  selector:
    matchLabels:
      {{- include "geocoder.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: typesense
  template:
    metadata:
      labels:
        {{- include "geocoder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: typesense
    spec:
      containers:
        - name: typesense
          image: "{{ .Values.typesense.image.repository }}:{{ .Values.typesense.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - "--enable-cors"
          ports:
            - name: http
              containerPort: {{ .Values.typesense.service.port }}
          env:
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geocoder.fullname" . }}-typesense
                  key: api-key
            - name: TYPESENSE_DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.typesense.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.typesense.persistence.size }}
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass | quote }}
        {{- end }}
{{- end }}

{{- if .Values.geocoder.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "geocoder.fullname" . }}-geocoder
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: geocoder
spec:
  type: {{ .Values.geocoder.service.type }}
  ports:
    - name: http
      port: {{ .Values.geocoder.service.port }}
      targetPort: http
  selector:
    {{- include "geocoder.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: geocoder
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geocoder.fullname" . }}-geocoder
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: geocoder
spec:
  replicas: {{ .Values.geocoder.replicas }}
  selector:
    matchLabels:
      {{- include "geocoder.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: geocoder
  template:
    metadata:
      labels:
        {{- include "geocoder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: geocoder
    spec:
      {{- if and .Values.global.aiEnabled .Values.gpu.enabled }}
      {{- with .Values.gpu.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gpu.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: geocoder
          image: {{ include "geocoder.appImage" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: ["python", "-m", "services.geocoder"]
          ports:
            - name: http
              containerPort: {{ .Values.geocoder.service.port }}
          env:
            {{- include "geocoder.esEnv" . | nindent 12 }}
            {{- include "geocoder.postgisEnv" . | nindent 12 }}
            {{- include "geocoder.embeddingEnv" . | nindent 12 }}
            - name: ENABLE_AI
              value: {{ ternary "true" "false" .Values.global.aiEnabled | quote }}
            - name: ENABLE_DEEP
              value: {{ .Values.geocoder.deep.enabled | quote }}
            - name: GOOGLE_MAPS_API_KEY
              value: {{ .Values.geocoder.deep.googleMapsApiKey | quote }}
          {{- if .Values.global.aiEnabled }}
          volumeMounts:
            {{- include "geocoder.modelVolumeMount" . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              {{- with .Values.geocoder.resources.requests }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            limits:
              {{- with .Values.geocoder.resources.limits }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
              {{- include "geocoder.gpuResources" . | nindent 14 }}
          readinessProbe:
            httpGet:
              path: /features
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /features
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      {{- if .Values.global.aiEnabled }}
      volumes:
        {{- include "geocoder.modelVolume" . | nindent 8 }}
      {{- end }}
---
{{- if .Values.geocoder.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "geocoder.fullname" . }}-geocoder
  labels:
    {{- include "geocoder.labels" . | nindent 4 }}
    app.kubernetes.io/component: geocoder
  {{- with .Values.geocoder.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.geocoder.ingress.className }}
  ingressClassName: {{ .Values.geocoder.ingress.className }}
  {{- end }}
  {{- if .Values.geocoder.ingress.tls }}
  tls:
    {{- toYaml .Values.geocoder.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.geocoder.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "geocoder.fullname" $ }}-geocoder
                port:
                  number: {{ $.Values.geocoder.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}

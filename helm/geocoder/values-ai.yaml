# Override values for AI-enabled deployment with GPU support
# Usage: helm install geocoder ./helm/geocoder -f values-ai.yaml

global:
  aiEnabled: true

gpu:
  enabled: true
  count: 1
  # Uncomment if your GPU nodes have a specific label
  # nodeSelector:
  #   nvidia.com/gpu.product: "NVIDIA-RTX-2000-Ada-Generation"
  # tolerations:
  #   - key: nvidia.com/gpu
  #     operator: Exists
  #     effect: NoSchedule

modelVolume:
  enabled: true
  size: 5Gi
  # If you have pre-downloaded models in an existing PVC, reference it here:
  # existingClaim: "my-existing-models-pvc"

# Increase resources for AI workloads
esInserter:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

tsInserter:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

geocoder:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

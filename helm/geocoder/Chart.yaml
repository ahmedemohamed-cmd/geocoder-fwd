apiVersion: v2
name: geocoder
description: |
  A Helm chart for the OSM geocoding stack: NATS, Elasticsearch, Redis,
  PostGIS, and the Python application services (es-inserter,
  postgis-inserter, geocoder). The downloader and watcher run as monthly
  CronJobs to refresh OSM data. Supports both CPU-only and GPU/AI modes.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - geocoder
  - osm
  - elasticsearch
  - redis
  - postgis
  - nats
  - embeddings
maintainers:
  - name: ahmedemohamed

# Deployment-specific overrides for the public HTTPS deployment behind
# Nginx Proxy Manager (NPM terminates TLS; services stay plain-HTTP internally).
#
# Single public host (DNS A -> 84.8.102.106, cert on NPM):
#   places.nourbyte.com/               -> zitadel               (identity; owns the root)
#   places.nourbyte.com/console        -> billing-frontend      (console SPA)
#   places.nourbyte.com/api/*          -> apisix                (metered geocoder; prefix stripped)
#   places.nourbyte.com/billing-api/*  -> billing-control-plane (management API; prefix stripped)
#
# Zitadel must own the domain root (no sub-path support), so the console SPA
# moves to /console. Base docker-compose.yaml keeps its localhost defaults for
# local dev; these overrides (merged by env-var key) point at the public host.
services:
  zitadel:
    environment:
      # TLS is terminated at NPM; Zitadel advertises the https issuer via these
      # and trusts the proxy's X-Forwarded-* headers (runs with --tlsMode disabled).
      - ZITADEL_EXTERNALDOMAIN=places.nourbyte.com
      - ZITADEL_EXTERNALPORT=443
      - ZITADEL_EXTERNALSECURE=true

  billing-control-plane:
    environment:
      - ZITADEL_ISSUER=https://places.nourbyte.com
      # Host header for internal calls to http://zitadel:8080 so Zitadel resolves
      # the right instance (must match EXTERNALDOMAIN; no port at :443).
      - ZITADEL_HOST_HEADER=places.nourbyte.com
      - BILLING_CORS_ORIGINS=https://places.nourbyte.com

  billing-zitadel-init:
    environment:
      - ZITADEL_HOST_HEADER=places.nourbyte.com
      # Public https issuer baked into the SPA's config.json (the internal
      # discovery hop reports http://, which would break OIDC issuer matching).
      - ZITADEL_ISSUER=https://places.nourbyte.com
      # SPA lives under /console; OIDC redirect/logout URIs must include it.
      - SPA_REDIRECT_URIS=https://places.nourbyte.com/console/callback,https://places.nourbyte.com/console/
      - SPA_LOGOUT_URIS=https://places.nourbyte.com/console/
      # Public, path-based base URLs baked into the SPA's runtime config.json.
      - API_BASE=https://places.nourbyte.com/billing-api
      - GATEWAY_BASE=https://places.nourbyte.com/api
